name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, Lint, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: |
          npm run build -w @orgflow/shared-types

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test API
        run: npm test -w apps/api

      - name: Test Web
        run: npm test -w apps/web

      - name: Security audit (high+)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: false

      - name: Build
        run: npm run build

  coverage:
    name: Coverage gates (vitest v8)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build -w @orgflow/shared-types

      # Coverage thresholds live in apps/*/vitest.config.ts. Vitest fails the
      # job if any threshold (project-wide or path-scoped) regresses.
      - name: API coverage
        run: npx --workspace apps/api vitest run --coverage --reporter=default
        working-directory: apps/api

      - name: Web coverage
        run: npx --workspace apps/web vitest run --coverage --reporter=default
        working-directory: apps/web

      - name: Upload API coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage/
          if-no-files-found: ignore

      - name: Upload Web coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage/
          if-no-files-found: ignore
